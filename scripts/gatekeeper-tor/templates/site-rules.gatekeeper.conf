# Gatekeeper site rules — HTTP allowlist (authorized Kali lab only)
# Hacker Planet LLC · CyberThreatGotchi
#
# Copy to /opt/ctg/tor-http-scrambler/site-rules.conf (chmod 600) or merge with scrambler rules.
#
# DEFAULT POSTURE (documented — enforce via scrambler + lab discipline):
#   - Block cleartext HTTP except domains listed below (captive portal, legacy lab HTTP).
#   - Prefer HTTPS everywhere else; use TOR mode for .onion and high-privacy paths.
#   - NEVER use HTTP for banking, credentials, or payment flows.
#
# Format: <host-or-suffix> <tor|http>
# Banking examples in site-rules.example remain http for *lab browser testing only* —
# production banking belongs on trusted HTTPS devices, not this sandbox lane.

# --- HTTP allowlist (lab captive / legacy clearnet only) ---
# lab-ap.local http
# captive.portal http

# --- Always TOR ---
.onion tor

# --- Prefer TOR for unknown clearnet (scrambler auto mode) ---
# * tor
